<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Manager</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main><header><div><p class="eyebrow">go.sujeeth.org</p><h1>URL Manager</h1></div><a class="signin" href="/.auth/login/aad?post_login_redirect_uri=/admin">Sign in with Microsoft</a></header>
<p id="notice" role="status">Sign in to create, edit, import, or export links.</p>
<section class="card"><h2>Create short URL</h2><form id="create-form"><label>Destination URL<input required name="destinationUrl" type="url" placeholder="https://example.org/page"></label><label>Custom alias <small>(optional and permanent)</small><input name="alias" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" placeholder="career-circle"></label><label>Description<input name="description" placeholder="What is this link for?"></label><button>Create short URL</button></form></section>
<section class="card"><h2>Import links</h2><p>Choose the prepared CSV file. Existing aliases are skipped; their destinations are not changed.</p><form id="import-form"><label for="import">CSV file<input id="import" type="file" accept=".csv,text/csv" required></label><button type="submit" id="import-submit">Import links</button></form><div id="import-report" role="status" aria-live="polite"></div></section>
<section class="card"><div class="section-head"><h2>Manage links</h2><button type="button" id="export">Export CSV</button></div><input id="search" type="search" placeholder="Search alias, destination, or description"><div id="results"></div></section>
</main><template id="edit-template"><form class="edit-form"><h3></h3><label>Destination URL<input name="destinationUrl" required type="url"></label><label>Description<input name="description"></label><label>Tags<input name="tags"></label><label>Expiration (optional)<input name="expiresOn" type="datetime-local"></label><label class="check"><input name="isActive" type="checkbox"> Active</label><button>Save changes</button></form></template><script src="/admin/admin.js"></script></body></html>
